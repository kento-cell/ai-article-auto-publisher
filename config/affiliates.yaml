# アフィリエイト設定
# ⚠️ このファイルには実IDを書かない。${ENV_VAR} 形式で .env を参照すること
# .env にトラッキングID・広告リンクを保存（.gitignoreで除外済み）

# 開示文（最小限）
disclosure: |
  ---
  ※一部にPRを含みます。

# ジャンル別アフィリエイトリンク
genres:
