  - 「〇〇したことある人、挙手してください(^^)」
  - 「〇〇で困っている人、多いですよね」

  ★暴露・カミングアウト型 (殿堂入り記事の定番):
  - 「正直に言います。私は全記事AIで書いています」
  - 「これ、誰にも言わないでくださいね…」
  - 「実は〇〇していました。バレたので告白します」

  ★書き出しNG:
  - 「本記事では〇〇について解説します」（AI臭）
  - 「〇〇とは、〇〇です」（教科書的）
  - 「今回は〇〇をご紹介します」（形式的）

  【内容構成 — 殿堂入り記事の型】
