# Claude.ai用プロンプトテンプレート

zenn_article_prompt: |
  以下の記事を「ネタ元」として、日本のWebエンジニア向けの完全オリジナル技術記事を作成してください。
  元記事の要約・翻訳・書き直しではなく、独自の分析と見解を中心にした記事を書くこと。

  【元記事情報】
  タイトル: {title}
  著者: {authors}
  出典: {source}
  URL: {url}
  公開日: {published_date}

  【本文抜粋】
  {content}

  【絶対ルール】
  1. 引用は必ず以下の形式で:
     > "引用文"
     >
     > 出典: 著者/組織名. "タイトル"
     > URL
     > (取得日: YYYY年MM月DD日)

  2. データ・統計は必ず出典明記
  3. 主観的評価は「筆者の意見」と明記
  4. 参考文献セクションを最後に追加

  【このツールの理念】
  タイトルは攻めていい。グレーギリギリでも合法なら構わない。
  ただし大々的に謳った以上、中身は絶対に濃くなければならない。
  タイトル負け = 読者への裏切り = 絶対禁止。

  【執筆スタイル — 最重要ルール】
  ■ 元記事の要約・翻訳・書き直しは絶対禁止。元記事は「ネタ元」に過ぎない。
  ■ 必ず以下の手法で独自記事を構成すること:
    1. 複数ソースの意見・データ・専門家の見解を統合する
    2. 「〇〇という見方がある」「△△の専門家は〜と指摘」等で多角的に構成
    3. 賛否が分かれるテーマでは明確にポジションを取る（中立禁止）
    4. 最終的に「筆者はこう考える」と自分の言葉で結論を出す
    5. 元記事の文章構造・言い回しをなぞらない。完全に自分の言葉で再構築する
  ■ 読者に「この筆者独自の視点だ」と感じさせること。
  ■ 事実の引用は出典付きで短く。分析・解釈・示唆が記事の主体であること。

  【整合性ルール — 違反は即不合格】
  ■ 数値・金額・日付は厳密に正確であること
    - 元記事が $99 million なら「99百万ドル（約143億円）」と正確に換算
    - 「99億円」と「146億円」を混在させるなど絶対禁止
    - 通貨換算は$1=150円で統一
  ■ 固有名詞（人名・企業名・製品名）のスペル・漢字を統一
  ■ 出典URLは必ず実在するものだけ。創作禁止
  ■ 見出し番号（1., 2., 3.）を付けない。H2/H3見出しは意味のある見出しのみ
  ■ 同じ内容のセクションを重複させない

  【伸びるタイトル型 — 2057記事の学習結果】
  note人気記事は以下の括弧プレフィックスで始まるものが圧倒的に多い:
  - 【完全無料】【永久保存版】【殿堂入り記事】【2026年最新】
  - 【保存版】【徹底解説】【完全ガイド】【脱〇〇】
  - 【朝メモ】【夜メモ】【感想】【コアメンバー】

  タイトル作成ルール:
  - タイトルは【】で始めるとクリック率UP（人気記事の多数が使用）
  - 35〜45文字が最適（人気記事の中央値）
  - 具体的な数字を入れる（月◯万円、◯選、◯日で、◯ステップ）
  - 絵文字は使わない（人気記事は0%）
  - キャッチー + 具体性 + 希少性の3要素

  【タイトル方針 — 攻める。煽る。ただし嘘はつかない。】
  タイトルは「読まないと損」「知らないと出遅れる」と思わせるレベルにする。
  控えめな学術調ではなく、実利と希少性と好奇心を全開にする。

  タイトルの型:
  - 「〇〇で月△万円の効率化を実現した全手順」（具体的な成果）
  - 「2026年のAI論文10選：次に来る技術を先読みする」（キュレーション × 先読み）
  - 「〇〇は死んだ？ △△時代の新スキルセット」（挑発的テーゼ）
  - 「非エンジニアがAIだけで〇〇を作った話」（意外性）
  - 「〇〇 + △△ + □□：三刀流で週末SaaS開発する方法」（ツールスタック）
  - 「〇〇の実務：失敗パターンと本当に動くアーキテクチャ」（実務 × 失敗談）
  - 「あの〇〇も使ってる！？ △△の知られざる活用法」（有名人/ブランド匂わせ）
  - 「〇〇が密かに採用した△△、その全貌」（リーク感 × 深掘り）
  - 「知ってた？ 〇〇の裏側で動いている技術の正体」（内部暴露感）

  有名人・ブランド・企業名の使用ルール:
  - 伏字・ほのめかし・匂わせはOK（「あのアイドルグループも…」「某大手IT企業が…」）
  - 実名を出す場合は、公式発表・公式SNS・インタビュー記事等のTier1-2ソースが必須
  - 根拠のない有名人言及は名誉毀損リスク → ソースなしの実名使用は禁止
  - タイトルで匂わせたら本文で必ず回収する（匂わせっぱなし禁止）

  【ターゲット読者】
  - AI・テクノロジーに貪欲なエンジニア
  - AIを使ったマネタイズに興味がある人
  - まだ世に広まっていない最先端の知識を先取りしたい人
  - 「他の人が知らないこと」に価値を感じる層

  【コンテンツ方針】
  - まだ広く知られていない論文・技術・手法を取り上げる
  - 「日本語で読めるのはこの記事だけ」レベルの希少性
  - 抽象的な概説ではなく、実装例・具体的手順・失敗談を含める
  - 有料記事として成立する密度（読後に「買ってよかった」と思わせる）

  【作成条件】
  1. 構成
     - タイトル（35文字以内、上記の型を使用）
     - 導入（200字、「なぜ今これを知るべきか」を煽る）
     - 元記事概要（引用明記）
     - 技術詳細（実装例・コード含む、コピペで動くレベル）
     - アーキテクチャ図指示（Mermaid記法）
     - 実践への示唆（「明日から使える」レベルの具体性）
     - まとめ（150字、次のアクション提案）
     - 参考文献

  2. リッチテキスト要件
     - 見出し: ##（H2）、###（H3）を適切に使用
     - 強調: **太字**で重要箇所を強調
     - コードブロック: ```言語名
     - 引用: > で引用ブロック
     - リスト・テーブル活用

  3. ビジュアル要件（Mermaid記法で指示）
     - アーキテクチャ図
     - フローチャート
     - シーケンス図

  4. コード要件
     - TypeScript/Python優先
     - エラーハンドリング必須
     - コメント付き
     - 実行可能な完全版

  5. 品質要件
     - 単なる翻訳ではなく、価値ある解説
     - 日本のエンジニアへの実践的示唆
     - 専門用語は初出時に説明
     - 具体例を豊富に

  【必須出力チェックリスト — これを満たさないと不合格】
  □ H2見出し(##)を最低4個使うこと（導入、概要、詳細、まとめ等）
  □ H1(#)はタイトルのみ。本文中にH1を使わないこと
  □ 引用ブロック(>)を最低3箇所使い、各引用に出典URL+取得日を付けること
  □ Mermaid図(```mermaid)を最低1個含めること
  □ コードブロック(```言語名)を最低1個含めること
  □ 参考文献セクション(## 参考文献)を末尾に配置し、URLリストを載せること

  文字数: 2500-3500字（コード除く）
  形式: Markdown

note_article_prompt: |
  以下のトレンド記事を「ネタ元」として、読者が思わずクリック・シェアしたくなる完全オリジナル記事を作成してください。
  元記事の要約・翻訳ではなく、独自の切り口と分析を中心にした記事を書くこと。

  【元記事情報】
  タイトル: {title}
  ソース: {source}
  URL: {url}
  トレンドスコア: {trend_score}

  【本文抜粋】
  {content}

  【このツールの理念】
  タイトルは攻めていい。グレーギリギリでも合法なら構わない。
  ただし大々的に謳った以上、中身は絶対に濃くなければならない。
  タイトル負け = 読者への裏切り = 絶対禁止。

  【執筆スタイル — 最重要ルール】
  ■ 元記事の要約・翻訳・書き直しは絶対禁止。元記事は「ネタ元」に過ぎない。
  ■ 必ず以下の手法で独自記事を構成すること:
    1. 複数ソースの意見・データ・専門家の見解を統合する
    2. 「〇〇という見方がある」「△△の専門家は〜と指摘」等で多角的に構成
    3. 賛否が分かれるテーマでは明確にポジションを取る（中立禁止）
    4. 最終的に「筆者はこう考える」と自分の言葉で結論を出す
    5. 元記事の文章構造・言い回しをなぞらない。完全に自分の言葉で再構築する
  ■ 読者に「この筆者独自の視点だ」と感じさせること。
  ■ 事実の引用は出典付きで短く。分析・解釈・示唆が記事の主体であること。

  【整合性ルール — 違反は即不合格】
  ■ 数値・金額・日付は厳密に正確であること
    - 元記事が $99 million なら「99百万ドル（約143億円）」と正確に換算
    - 「99億円」と「146億円」を混在させるなど絶対禁止
    - 通貨換算は$1=150円で統一
  ■ 固有名詞（人名・企業名・製品名）のスペル・漢字を統一
  ■ 出典URLは必ず実在するものだけ。創作禁止
  ■ 見出し番号（1., 2., 3.）を付けない。H2/H3見出しは意味のある見出しのみ
  ■ 同じ内容のセクションを重複させない

  【伸びるタイトル型 — 2057記事の学習結果】
  note人気記事は以下の括弧プレフィックスで始まるものが圧倒的に多い:
  - 【完全無料】【永久保存版】【殿堂入り記事】【2026年最新】
  - 【保存版】【徹底解説】【完全ガイド】【脱〇〇】
  - 【朝メモ】【夜メモ】【感想】【コアメンバー】

  タイトル作成ルール:
  - タイトルは【】で始めるとクリック率UP（人気記事の多数が使用）
  - 35〜45文字が最適（人気記事の中央値）
  - 具体的な数字を入れる（月◯万円、◯選、◯日で、◯ステップ）
  - 絵文字は使わない（人気記事は0%）
  - キャッチー + 具体性 + 希少性の3要素

  【タイトル方針 — 攻める。煽る。ただし嘘はつかない。】
  タイトルの追加パターン:
  - 「あの〇〇も使ってる！？ 話題の△△を徹底検証」（有名人匂わせ）
  - 「某有名インフルエンサーが密かに通う〇〇」（リーク感）
  - 「知ってた？ あの〇〇の裏側にある真実」（暴露感）
  - 「〇〇が絶対に教えたくない△△の秘密」（禁断感）

  有名人・ブランド名の使用ルール:
  - 伏字・ほのめかし・匂わせはOK
  - 実名を出す場合は公式ソース（公式SNS、インタビュー記事等）が必須
  - ソースなしの実名使用は禁止
  - タイトルで匂わせたら本文で必ず回収する

  【コンテンツ方針 — バズる記事の作り方】
  ■ ジャンル別の書き方:

  ● グルメ・居酒屋・カフェ系:
    - 「連れて行ったら絶対にモテる居酒屋3選！新宿編」のようなキャッチーなタイトル
    - 紹介するのは必ず個人店・隠れた名店のみ（チェーン店は絶対に紹介しない）
    - 「知る人ぞ知る」「予約困難」「常連だけが知る裏メニュー」等の特別感を演出
    - 具体的な店名・最寄り駅・予算感・おすすめメニューを記載
    - 写真映えポイント、デートでの使い方を提案

  ● 韓国トレンド・美容系:
    - 「韓国で今話題の〇〇」「日本未上陸の最新〇〇」等の速報感
    - 韓国現地の情報源に基づくリアルな最新情報
    - 日本で買える方法・代替品も紹介
    - ビフォーアフター・比較画像の指示を含める

  ● コーヒー・バリスタ系:
    - 専門知識を分かりやすく噛み砕く（焙煎度、抽出法、豆の産地）
    - 自宅で再現できるプロの技を伝授
    - おすすめのカフェは個人経営の隠れた名店のみ

  ● ライフスタイル・自分磨き系:
    - 美意識高めの読者が「これ知らなかった」と思う内容
    - 具体的なアクションプラン付き
    - メンズ美容、ファッション、デートのコツ等

  ■ タイトルの型（バズりやすいパターン）:
    - 「〇〇選！△△編」（リスト × エリア）
    - 「知らないと損する〇〇」（損失回避）
    - 「プロが教える〇〇の極意」（権威性）
    - 「韓国で今話題の〇〇、日本でも使える？」（速報 × 実用）
    - 「非モテを脱出する〇〇術」（変身願望）

  【絶対ルール — 違反は即不合格】
  1. 引用は必ず出典明記（URL+取得日）
  2. 「月○万円稼いだ」等の誇大表現は禁止
  3. チェーン店（スタバ、鳥貴族、サイゼリヤ等）は絶対に紹介しない
  4. **元ソースに記載されている店舗・商品のみ紹介すること**
     - 元記事に載っていない店名を自分で追加・創作してはいけない
     - 「〇〇という店が話題です」と書く場合、元ソースのURLで裏付けできること
     - 元ソースの情報が不足している場合は、具体的な店名を出さずに
       「このエリアには〇〇な特徴の個人店が増えている」等の一般論で書く
  5. 架空の店名・住所・メニュー名は絶対に書かない
     - 実在確認できない固有名詞は使用禁止
  6. 検証系は証拠前提で記述
  7. 主観は「筆者の感想です」と明記

  【作成条件】
  1. 構成
     - タイトル（35文字以内、上記の型を使用。キャッチーかつ具体的）
     - 導入（なぜ今これが話題か。読者の好奇心を刺激する200字）
     - 本文（具体例・図解・比較多め。抽象論禁止）
     - 実践方法・アクセス情報（住所・最寄り駅・営業時間・予算）
     - まとめ（次のアクション提案）
     - 参考リンク

  2. トーン
     - 友達に教えるような親しみやすさ
     - 専門用語は平易に説明
     - 「です・ます」調だが、堅すぎない
     - 読者に「行ってみたい」「やってみたい」と思わせる

  3. ビジュアル
     - 図表・Mermaid多用
     - Before/After比較（該当時）

  【必須出力チェックリスト — これを満たさないと不合格】
  □ H2見出し(##)を最低4個使うこと
  □ H1(#)はタイトルのみ。本文中にH1を使わないこと
  □ 引用ブロック(>)を最低3箇所使い、各引用に出典を付けること
  □ 図表(Mermaid ```mermaid またはテーブル)を最低1個含めること
  □ 参考文献セクション(## 参考文献)を末尾に配置し、URLリストを載せること

  文字数: 2500-3500字
  形式: Markdown

quality_evaluation_prompt: |
  以下の技術記事を評価してください。

  【記事内容】
  {article}

  【評価基準】
  1. オリジナリティ（10点満点）
     - 単なる翻訳・要約ではない
     - 独自の視点・解説がある
     - 実践的な示唆がある

  2. 技術的正確性（10点満点）
     - 技術説明が正確
     - コード例が動作する
     - 誤解を招く表現がない

  3. 視認性・構成（10点満点）
     - 見出し階層が適切
     - コードブロックが適切
     - 図表指示がある
     - リストが効果的

  4. 引用の適切性（10点満点）
     - 引用元が明記されている
     - 引用ブロックが適切
     - 参考文献リストがある

  5. 実用性（10点満点）
     - 読者が実践できる内容
     - 具体的なコード例
     - 実装のヒント

  【評価出力（JSON形式）】
  {
    "scores": {
      "originality": 0-10,
      "accuracy": 0-10,
      "readability": 0-10,
      "citation": 0-10,
      "practicality": 0-10
    },
    "total": 0-50,
    "pass": true/false,
    "feedback": "具体的な改善点",
    "should_regenerate": true/false
  }

# 構成パターンローテーション（提案D: テンプレ過学習防止）
article_structures:
  - name: standard
    description: "標準構成: 導入→概要→詳細→まとめ"
    outline: |
      1. 導入（なぜ重要か）
      2. 元記事概要
      3. 技術詳細/本文
      4. 実践への示唆
      5. まとめ
      6. 参考文献

  - name: tutorial
    description: "チュートリアル形式: ステップバイステップ"
    outline: |
      1. ゴール（何ができるようになるか）
      2. 前提条件
      3. Step 1: ...
      4. Step 2: ...
      5. Step 3: ...
      6. トラブルシューティング
      7. 次のステップ

  - name: comparison
    description: "比較レビュー形式: 選択肢の評価"
    outline: |
      1. 比較の背景と目的
      2. 候補一覧
      3. 評価軸の説明
      4. 比較表
      5. ユースケース別おすすめ
      6. 結論

  - name: deep_dive
    description: "深掘り解説: 一つのトピックを徹底分析"
    outline: |
      1. なぜ今このトピックが重要か
      2. 基礎知識（前提の確認）
      3. 核心部分の詳細解説
      4. 実装例/具体例
      5. 知られていない落とし穴
      6. 筆者の見解
      7. 参考文献

  - name: qa
    description: "Q&A形式: 読者の疑問に答える"
    outline: |
      1. この記事で答える疑問
      2. Q1: ...
      3. Q2: ...
      4. Q3: ...
      5. まとめ: 全体像
      6. さらに深く知りたい人へ

  - name: listicle
    description: "リスト記事: 〇〇選！△△編（note向け、バズりやすい）"
    outline: |
      1. なぜこのリストを作ったか（導入）
      2. 選定基準（何を基準に選んだか）
      3. No.1: 〇〇（特徴、おすすめポイント、アクセス）
      4. No.2: 〇〇
      5. No.3: 〇〇
      6. 番外編（惜しくも選外だけど注目）
      7. まとめ + 読者への提案

  - name: trend_report
    description: "トレンドレポート: 韓国/海外の最新情報を速報的に伝える"
    outline: |
      1. 速報: 何が起きているか
      2. 背景: なぜ今話題なのか
      3. 現地の反応・データ
      4. 日本への影響・使い方
      5. 入手方法・体験方法
      6. 今後の予測
      7. 参考リンク

  - name: howto
    description: "How-to: プロが教える〇〇の方法（コーヒー、美容等）"
    outline: |
      1. この記事で身につくこと
      2. 必要なもの（道具・材料）
      3. 手順1: ...
      4. 手順2: ...
      5. 手順3: ...
      6. よくある失敗と対処法
      7. プロのコツ（ワンランク上のテクニック）

# 構成パターン選定ルール
structure_selection:
  zenn:
    # 技術記事の構成は記事内容で判定
    rules:
      - keyword: ["入門", "始め方", "チュートリアル", "getting started"]
        structure: tutorial
      - keyword: ["比較", "vs", "選び方", "おすすめ"]
        structure: comparison
      - keyword: ["仕組み", "内部", "原理", "アーキテクチャ"]
        structure: deep_dive
      - keyword: ["FAQ", "質問", "疑問"]
        structure: qa
      - default: standard

  note:
    # note記事の構成はソースカテゴリで判定
    rules:
      - source_category: ["gourmet", "coffee", "izakaya"]
        structure: listicle
      - source_category: ["korean", "kbeauty", "ktrend"]
        structure: trend_report
      - source_category: ["beauty", "selfcare", "coffee"]
        structure: howto
      - source_category: ["tech", "ai", "llm"]
        structure: standard
      - default: standard
