  ★必ず「一人称型」で始める (TOP記事の最多パターン):
  - 「私は〜」「僕は〜」「先日、〇〇があって」
  - 「正直、〇〇してしまいました」
  - 「ぶっちゃけ、〇〇の話です」

  ★読者巻き込み型 (第2位):
