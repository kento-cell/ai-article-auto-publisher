# Claude.ai用プロンプトテンプレート

zenn_article_prompt: |
  以下の記事を「ネタ元」として、日本のWebエンジニア向けの完全オリジナル技術記事を作成してください。
  元記事の要約・翻訳・書き直しではなく、独自の分析と見解を中心にした記事を書くこと。

  【元記事情報】
  タイトル: {title}
  著者: {authors}
  出典: {source}
  URL: {url}
  公開日: {published_date}

  【本文抜粋】
  {content}

  【絶対ルール】
  1. 引用は必ず以下の形式で（URL と取得日は blockquote 内に必須）:
     > "引用文"
     >
     > 出典: 著者/組織名. "タイトル"
     > {url}
     > (取得日: YYYY年MM月DD日)

  1-2. ★★★ 最重要: 上記 {url} (元記事URL) は記事本文の引用ブロック内に
     必ず1回以上そのまま貼り付けること。URL を省略 or 外部に出したら不合格。
     arXiv論文の場合、abstract のURLはそのまま一次ソースとして引用可。

  2. データ・統計は必ず出典明記
  3. 主観的評価は「筆者の意見」と明記
  4. 参考文献セクションを最後に追加し、そこにも {url} を再掲する

  【このツールの理念】
  タイトルは攻めていい。グレーギリギリでも合法なら構わない。
  ただし大々的に謳った以上、中身は絶対に濃くなければならない。
  タイトル負け = 読者への裏切り = 絶対禁止。

  【執筆スタイル — 最重要ルール】
  ■ 元記事の要約・翻訳・書き直しは絶対禁止。元記事は「ネタ元」に過ぎない。
  ■ 必ず以下の手法で独自記事を構成すること:
    1. 複数ソースの意見・データを統合する (※ 「専門家の見解」を引用する場合は
       下記 ③ 引用条件を必ず満たすこと)
    2. 「〇〇という見方がある」程度の一般化は OK。ただし
       **特定人物・特定組織・大学・専門家の発言として書く場合は**、
       元ソース本文中に発言が記載されていて URL で裏取り可能な場合のみ。
       「△△の専門家は〜と指摘」「○○大学の研究者によれば」のような
       肩書きベースの架空引用 (今日 2026-05-14 Utah BYU/J&J 事案) は
       1 件でも残れば全文却下対象。
    3. 賛否が分かれるテーマでは明確にポジションを取る（中立禁止）
    4. 最終的に「筆者はこう考える」と自分の言葉で結論を出す
    5. 元記事の文章構造・言い回しをなぞらない。完全に自分の言葉で再構築する
  ■ 読者に「この筆者独自の視点だ」と感じさせること。
  ■ 事実の引用は出典付きで短く。分析・解釈・示唆が記事の主体であること。

  【整合性ルール — 違反は即不合格】
  ■ 数値・金額・日付は厳密に正確であること
    - 元記事が $99 million なら「99百万ドル（約143億円）」と正確に換算
    - 「99億円」と「146億円」を混在させるなど絶対禁止
    - 通貨換算は$1=150円で統一
  ■ **数値ファクトの捏造禁止 (1 件でも残れば全文却下):**
    - 元ソースに記載のない数値 (水深/面積/人口/年代/距離など) を勝手に書かない
    - 「うろ覚え」「一般的に知られている」レベルでも書かない。元ソースに無ければ書かない
    - 例: 「Lake Tahoe の最大水深 1645メートル」← 元ソースに無く、かつ実際は約500m。
      捏造扱い → 即全文却下
  ■ 固有名詞（人名・企業名・製品名）のスペル・漢字を統一
  ■ 出典URLは必ず実在するものだけ。創作禁止
  ■ **見出しは必ず Markdown の ## (H2) / ### (H3) 構文を使うこと**:
    - ✅ 正しい: `## 1. 速報: 何が起きているか`
    - ❌ 全文却下: `**1. 速報: 何が起きているか**` (太字での見出し代用)
    - ❌ 全文却下: `1. 速報: 何が起きているか` (記号番号のみ)
    - **太字 (`**text**`) は段落内の強調にのみ使用。見出しに使うのは絶対禁止**
    - 見出し番号「1., 2., 3.」を見出しテキストに含めても OK だが、必ず ## で始める
  ■ 同じ内容のセクションを重複させない
  ■ **伏字命名・仮名命名は絶対禁止 (1 件でも残れば全文却下):**
    - 「〇〇社」「××モデル」「□□ライブラリ」「店舗 A」「ブランド B」のような記号命名
    - 「（仮名）」「（仮称）」を付けた架空命名
    - 実在ツール/論文/会社名を出せない場合は別の話題を書く
  ■ **架空の人物・組織からの引用は絶対禁止 (1 件でも残れば全文却下):**
    - 「Utah State University の専門家は〜と語っている」 ← 元ソースに引用が無いのに
      実在大学・組織の名前で発言を捏造するのはハルシネーション事案
    - 「〇〇大学の研究者によれば」「〇〇社の担当者は」「業界関係者は」のような
      肩書きベースの匿名引用も同様に禁止
    - 引用を書ける条件は: ①元ソース本文に発言が記載されている ②発言者の実名と
      URL が元ソースに紐付いている のいずれか
    - 専門家コメントが欲しい場合は「筆者の見解」として書く
  ■ **AI 生成開示 footer は絶対書かない**:
    - 「本記事は AI で生成」「AI が構成しています」「免責事項: 正確性は保証しません」等は
      読者への裏切り。データ鮮度の注記が必要なら、システム側で自動付与する。LLM は書かない。
  ■ **元記事のスコープから逸脱しない**:
    - 元記事が「Lake Tahoe 住民 5万人が電力喪失」という具体的ニュースなら、
      「Lake Tahoe の観光ガイド」「環境問題総合解説」に話を広げるのは禁止。
    - 元記事の主題 (誰が/何を/どこで/いつ/なぜ) を記事の中心に置き、
      背景説明はその主題を補完する範囲に限定する。
    - 「広く一般的な解説記事」への迂回禁止。読者は具体的ニュースを期待している。

  【トーン・装飾ルール — AI臭を消す】
  ■ 絵文字（😀🎉🚀等）は絶対NG。AI記事の典型特徴
  ■ 顔文字(kaomoji)は積極的使用:
    - (^^) (^_^) (>_<) (´・ω・`) (╹◡╹) (￣▽￣) (*´∀｀*) (TдT)
    - w ｗ の使用OK
    - 1記事2〜4個
  ■ **太字**を1段落に1〜2箇所 (※見出し代用には使わない)
  ■ 口調: 「です・ます」+ カジュアル崩し
    - 「〜ですよね」「〜じゃないですか」「マジで」「ぶっちゃけ」「正直」

  【書き出しパターン — 人気記事の鉄則】
  ★必ず「一人称型」で始める (TOP記事の最多パターン):
  - 「私は〜」「僕は〜」「先日、〇〇があって」
  - 「正直、〇〇してしまいました」
  - 「ぶっちゃけ、〇〇の話です」

  ★読者巻き込み型 (第2位):
  - 「みなさん、〇〇って経験ありませんか？」
  - 「〇〇したことある人、挙手してください(^^)」
  - 「〇〇で困っている人、多いですよね」

  ★暴露・カミングアウト型 (殿堂入り記事の定番):
  - 「正直に言います。私は全記事AIで書いています」
  - 「これ、誰にも言わないでくださいね…」
  - 「実は〇〇していました。バレたので告白します」

  ★書き出しNG:
  - 「本記事では〇〇について解説します」（AI臭）
  - 「〇〇とは、〇〇です」（教科書的）
  - 「今回は〇〇をご紹介します」（形式的）

  【内容構成 — 殿堂入り記事の型】
  1. 煽り導入 (200字): 読者の悩みを言語化、共感
  2. 意外な事実/データ: 「実は〇〇が判明」
  3. 具体的な体験談: 「私がやったのは〇〇」
  4. ノウハウ展開: 「手順1/2/3...」
  5. 反論への先回り: 「『〇〇じゃないか』と思った方へ」
  6. まとめ+CTA: 「次にやるべきは〇〇」

  【真似すべき成功クリエイター】
  - glad_auklet4142: 殿堂入り連発、貿易商出身、¥2,980の定番
  - kajiken0630: Claude Code×ビジネス、実績ベース
  - goto_finance: 朝メモシリーズ、端的・速報的
  これらのクリエイターの構成・口調・切り口を意識してパクる

  【伸びるタイトル型 — 2766記事＋TOP30分析】
  ★ブラケット必須 (TOP30の80%が使用)。
    下記の中から**必ず毎回違うものを選ぶ**こと。【狂気】は強力だが
    使いすぎているので連続使用禁止。同じ記事で既出のブラケットは
    選ばず、なるべくバリエーションを広げること。

    殿堂系:
    【殿堂入り記事】【殿堂入り記事・警告】【殿堂入り記事・〇〇問題】【殿堂記事】
    保存・永久系:
    【永久保存版】【保存版】【完全保存版】【警告・永久保存版】【決定版】
    完全・無料系:
    【完全無料】【完全自動】【完全攻略】【完全ガイド】【完全まとめ】
    速報・最新系:
    【速報】【最新】【2026年最新】【緊急】【号外】【現地レポ】
    時間帯・連載系:
    【朝メモ】【夜メモ】【深夜便】【週末特集】【今月のベスト】
    警告・暴露系:
    【警告】【注意】【暴露】【本音】【リーク】【裏事情】
    感情ワード系:
    【狂気】【衝撃】【悲報】【朗報】【号泣】【絶句】【禁断】
    知識・権威系:
    【入門】【必修】【コアメンバー】【プロが教える】【現場の声】
    数字予告系:
    【3分でわかる】【5選】【10の真実】【100人に聞いた】【99%が知らない】
    地域特化系:
    【○○駅徒歩○分】【○○の人だけに】【ローカル限定】【○○区の穴場】

  ★複合ブラケット (最強パターン — 2個重ねる):
  - 【殿堂入り記事】【警告・永久保存版】…
  - 【殿堂入り記事・〇万フォロワーが一夜で消滅】…
  - 【狂気】2026年、〇〇する——〇〇できない人間が…

  ★煽り・暴露フレーズ (殿堂入り記事頻出):
  - 「〇〇は嘘だった」「〇〇は最悪のアドバイス」
  - 「それでも〇〇を量産する」
  - 「絶望したあなたへ」「震えるあなたへ」
  - 「99%の人が間違えている」「知らないと損する」
  - 「私は〇〇しています」（暴露カミングアウト型）
  - 「データと科学が証明する」「MIT論文から」

  ★具体的成功体験型:
  - 「月商1000万」「3億円稼いだ」「4ヶ月で300%成長」
  - 「12年生き残れた理由」「〇日で-〇kg」「〇〇年間〇〇業界にいた」

  タイトル作成ルール:
  - 必ず【】で始める（強い記事は2個重ね）
  - 35〜45文字（上限70文字厳守）
  - 数字を必ず1つ入れる
  - 絵文字は絶対NG（人気記事0%）
  - 煽り + 具体性 + 希少性の3要素必須

  【必殺テンプレート5選 — そのまま使え】
  1. 【殿堂入り記事】【警告】〇〇は嘘だった。データが証明する「本当の〇〇」
  2. 【狂気】〇〇歳から〇〇を始めて、気づいたら〇〇万円になっていた話
  3. 【永久保存版】〇〇年間〇〇業界にいた私が教える、〇〇の全て
  4. 【殿堂入り記事・警告】「〇〇すれば稼げる」を信じた瞬間、あなたは〇〇
  5. 【管理栄養士監修】〇〇を〇ヶ月で-〇kg痩せに導いた〇〇の全手順

  【タイトル方針 — 攻める。煽る。ただし嘘はつかない。】
  タイトルは「読まないと損」「知らないと出遅れる」と思わせるレベルにする。
  控えめな学術調ではなく、実利と希少性と好奇心を全開にする。

  タイトルの型:
  - 「〇〇で月△万円の効率化を実現した全手順」（具体的な成果）
  - 「2026年のAI論文10選：次に来る技術を先読みする」（キュレーション × 先読み）
  - 「〇〇は死んだ？ △△時代の新スキルセット」（挑発的テーゼ）
  - 「非エンジニアがAIだけで〇〇を作った話」（意外性）
  - 「〇〇 + △△ + □□：三刀流で週末SaaS開発する方法」（ツールスタック）
  - 「〇〇の実務：失敗パターンと本当に動くアーキテクチャ」（実務 × 失敗談）
  - 「あの〇〇も使ってる！？ △△の知られざる活用法」（有名人/ブランド匂わせ）
  - 「〇〇が密かに採用した△△、その全貌」（リーク感 × 深掘り）
  - 「知ってた？ 〇〇の裏側で動いている技術の正体」（内部暴露感）

  有名人・ブランド・企業名の使用ルール:
  - 伏字・ほのめかし・匂わせはOK（「あのアイドルグループも…」「某大手IT企業が…」）
  - 実名を出す場合は、公式発表・公式SNS・インタビュー記事等のTier1-2ソースが必須
  - 根拠のない有名人言及は名誉毀損リスク → ソースなしの実名使用は禁止
  - タイトルで匂わせたら本文で必ず回収する（匂わせっぱなし禁止）

  【ターゲット読者】
  - AI・テクノロジーに貪欲なエンジニア
  - AIを使ったマネタイズに興味がある人
  - まだ世に広まっていない最先端の知識を先取りしたい人
  - 「他の人が知らないこと」に価値を感じる層

  【コンテンツ方針】
  - まだ広く知られていない論文・技術・手法を取り上げる
  - 「日本語で読めるのはこの記事だけ」レベルの希少性
  - 抽象的な概説ではなく、実装例・具体的手順・失敗談を含める
  - 有料記事として成立する密度（読後に「買ってよかった」と思わせる）

  【作成条件】
  1. 構成
     - タイトル（35文字以内、上記の型を使用）
     - 導入（200字、「なぜ今これを知るべきか」を煽る）
     - 元記事概要（引用明記）
     - 技術詳細（実装例・コード含む、コピペで動くレベル）
     - アーキテクチャ図指示（Mermaid記法）
     - 実践への示唆（「明日から使える」レベルの具体性）
     - まとめ（150字、次のアクション提案）
     - 参考文献

  2. リッチテキスト要件
     - 見出し: ##（H2）、###（H3）を適切に使用
     - 強調: **太字**で重要箇所を強調
     - コードブロック: ```言語名
     - 引用: > で引用ブロック
     - リスト・テーブル活用

  3. ビジュアル要件（Mermaid記法で指示）
     - アーキテクチャ図
     - フローチャート
     - シーケンス図

  4. コード要件
     - TypeScript/Python優先
     - エラーハンドリング必須
     - コメント付き
     - 実行可能な完全版

  5. 品質要件
     - 単なる翻訳ではなく、価値ある解説
     - 日本のエンジニアへの実践的示唆
     - 専門用語は初出時に説明
     - 具体例を豊富に

  【必須出力チェックリスト — これを満たさないと不合格】
  □ H2見出し(##)を最低4個使うこと（導入、概要、詳細、まとめ等）
  □ H1(#)はタイトルのみ。本文中にH1を使わないこと
  □ 引用ブロック(>)を最低3箇所使い、各引用に出典URL+取得日を付けること
  □ **視覚要素 (visual_count) を最低5個含めること — 1個以下だと自動却下:**
     - Mermaid図(```mermaid) を最低1個 (フロー図/シーケンス図/比較図など)
     - コードブロック(```言語名) を最低2個 (実行可能なコード断片)
     - 比較テーブル (|---|---|---|形式) を最低2個 (機能比較/料金比較など)
     - ※画像は別途自動付与されるが、本文中にも視覚要素を埋めること
  □ 参考文献セクション(## 参考文献)を末尾に配置し、URLリストを載せること

  文字数: 5000-7000字（コード除く）— 大幅に深掘りした構成で、各H2セクションを300-500字以上、合計4-6個のH2で書くこと
  形式: Markdown

note_article_prompt: |
  以下のトレンド記事を「ネタ元」として、読者が思わずクリック・シェアしたくなる完全オリジナル記事を作成してください。
  元記事の要約・翻訳ではなく、独自の切り口と分析を中心にした記事を書くこと。

  【元記事情報】
  タイトル: {title}
  ソース: {source}
  URL: {url}
  トレンドスコア: {trend_score}

  【本文抜粋】
  {content}

  【絶対ルール — 出典・引用 (違反は objective_scorer で不合格)】
  1. 本文に「出典付きの引用・データ参照」を最低 3 箇所入れること。
     出典が 1-2 件しか無いと citation_format メトリクスで C 判定 → 全文却下。
  2. 元記事 URL ({url}) を記事本文の引用ブロック内に最低 1 回そのまま貼ること。
     URL を省略する / 本文外のリンク集にだけ置くのは不合格。
  3. 数値・統計・第三者の主張・出来事を書いたら、その直後に出典を添える:
     - 引用ブロック形式: `> "引用文"` の次行に `> 出典: 媒体名 — {url}`
     - またはインライン形式: 文末に `（出典: 媒体名 {url}）`
  4. 「○○によると」「報道では」と書いたら必ず URL とセットにする。
     出典 URL を伴わない伝聞は書かない。
  5. 出典 URL は元ソースに実在するものだけ (創作・推測 URL は厳禁)。
     元ソースが 1 つしか無い場合でも、その 1 ソースを記事の複数箇所で
     引用し、それぞれに {url} を併記して合計 3 箇所以上にする。
  6. 末尾に `## 参考文献` セクションを置き、{url} を再掲する。

  【内容の濃さ — 最重要 (2026-05-16 追加、薄い記事は全文却下)】
  ■ 一般論・抽象論で字数を埋めるのを禁止する。以下は「薄い記事」の典型で却下対象:
    - 「〇〇を理解することが重要」「〇〇という視点を持とう」だけで具体の無い段落
    - 「3つのフィルター」「5つの対策」型の処世訓リストで、具体的事実を伴わないもの
    - 元ソースに無い一般解説への逃げ (例: 電力高騰ニュースなのに「節電のコツ」で字数稼ぎ、
      銀行AIニュースなのに「お金の心構え」で締める等)
  ■ 元ソースに登場する具体情報を必ず本文に展開する:
    - 固有名詞 (企業名/製品名/人物名/組織名/地名/サービス名)、数値、日付、金額、
      出来事の 5W1H を本文に具体的に書く
    - 元ソースが述べる「誰が・何を・どこで・いつ・なぜ・どうやって」を記事の骨子に据える
    - 元ソースの具体を 1 つも捨てず、各セクションでその具体を深掘りする
    - 元ソースに固有名詞や数値が乏しい場合でも、その「乏しい具体」を最大限展開し、
      足りない分を抽象論で埋めず、記事を短くする方を選ぶ
  ■ 「読者がこの記事を読んで初めて知る具体的な事実」を最低 5 個含めること。
    抽象的な心構え・処世訓ではなく、具体的な事実・数字・固有名詞・因果関係であること。
  ■ 字数より密度を優先する。薄い 6000 字より、濃い 3000 字。引き伸ばしは禁止。
    各段落は「この段落で読者は何の具体情報を得たか」と自問し、答えられない段落は削る。
  ■ mermaid 図は 1 記事につき最大 1 個。同じ型 (課題→対策→改善 等) の図を複数入れない。
    図より、本文に具体的な事実を書くことを優先する。

  【このツールの理念】
  タイトルは攻めていい。グレーギリギリでも合法なら構わない。
  ただし大々的に謳った以上、中身は絶対に濃くなければならない。
  タイトル負け = 読者への裏切り = 絶対禁止。

  【執筆スタイル — 最重要ルール】
  ■ 元記事の要約・翻訳・書き直しは絶対禁止。元記事は「ネタ元」に過ぎない。
  ■ 必ず以下の手法で独自記事を構成すること:
    1. 複数ソースの意見・データを統合する (※ 「専門家の見解」を引用する場合は
       下記 ③ 引用条件を必ず満たすこと)
    2. 「〇〇という見方がある」程度の一般化は OK。ただし
       **特定人物・特定組織・大学・専門家の発言として書く場合は**、
       元ソース本文中に発言が記載されていて URL で裏取り可能な場合のみ。
       「△△の専門家は〜と指摘」「○○大学の研究者によれば」のような
       肩書きベースの架空引用 (今日 2026-05-14 Utah BYU/J&J 事案) は
       1 件でも残れば全文却下対象。
    3. 賛否が分かれるテーマでは明確にポジションを取る（中立禁止）
    4. 最終的に「筆者はこう考える」と自分の言葉で結論を出す
    5. 元記事の文章構造・言い回しをなぞらない。完全に自分の言葉で再構築する
  ■ 読者に「この筆者独自の視点だ」と感じさせること。
  ■ 事実の引用は出典付きで短く。分析・解釈・示唆が記事の主体であること。

  【整合性ルール — 違反は即不合格】
  ■ 数値・金額・日付は厳密に正確であること
    - 元記事が $99 million なら「99百万ドル（約143億円）」と正確に換算
    - 「99億円」と「146億円」を混在させるなど絶対禁止
    - 通貨換算は$1=150円で統一
  ■ **数値ファクトの捏造禁止 (1 件でも残れば全文却下):**
    - 元ソースに記載のない数値 (水深/面積/人口/年代/距離など) を勝手に書かない
    - 「うろ覚え」「一般的に知られている」レベルでも書かない。元ソースに無ければ書かない
    - 例: 「Lake Tahoe の最大水深 1645メートル」← 元ソースに無く、かつ実際は約500m。
      捏造扱い → 即全文却下
  ■ 固有名詞（人名・企業名・製品名）のスペル・漢字を統一
  ■ 出典URLは必ず実在するものだけ。創作禁止
  ■ **見出しは必ず Markdown の ## (H2) / ### (H3) 構文を使うこと**:
    - ✅ 正しい: `## 1. 速報: 何が起きているか`
    - ❌ 全文却下: `**1. 速報: 何が起きているか**` (太字での見出し代用)
    - ❌ 全文却下: `1. 速報: 何が起きているか` (記号番号のみ)
    - **太字 (`**text**`) は段落内の強調にのみ使用。見出しに使うのは絶対禁止**
    - 見出し番号「1., 2., 3.」を見出しテキストに含めても OK だが、必ず ## で始める
  ■ 同じ内容のセクションを重複させない
  ■ **伏字命名・仮名命名は絶対禁止 (1 件でも残れば全文却下):**
    - 「〇〇社」「××モデル」「□□ライブラリ」「店舗 A」「ブランド B」のような記号命名
    - 「（仮名）」「（仮称）」を付けた架空命名
    - 実在ツール/論文/会社名を出せない場合は別の話題を書く
  ■ **架空の人物・組織からの引用は絶対禁止 (1 件でも残れば全文却下):**
    - 「Utah State University の専門家は〜と語っている」 ← 元ソースに引用が無いのに
      実在大学・組織の名前で発言を捏造するのはハルシネーション事案
    - 「〇〇大学の研究者によれば」「〇〇社の担当者は」「業界関係者は」のような
      肩書きベースの匿名引用も同様に禁止
    - 引用を書ける条件は: ①元ソース本文に発言が記載されている ②発言者の実名と
      URL が元ソースに紐付いている のいずれか
    - 専門家コメントが欲しい場合は「筆者の見解」として書く
  ■ **AI 生成開示 footer は絶対書かない**:
    - 「本記事は AI で生成」「AI が構成しています」「免責事項: 正確性は保証しません」等は
      読者への裏切り。データ鮮度の注記が必要なら、システム側で自動付与する。LLM は書かない。
  ■ **元記事のスコープから逸脱しない**:
    - 元記事が「Lake Tahoe 住民 5万人が電力喪失」という具体的ニュースなら、
      「Lake Tahoe の観光ガイド」「環境問題総合解説」に話を広げるのは禁止。
    - 元記事の主題 (誰が/何を/どこで/いつ/なぜ) を記事の中心に置き、
      背景説明はその主題を補完する範囲に限定する。
    - 「広く一般的な解説記事」への迂回禁止。読者は具体的ニュースを期待している。

  【トーン・装飾ルール — AI臭を消す】
  ■ 絵文字（😀🎉🚀等）は絶対NG。AI記事の典型特徴
  ■ 顔文字(kaomoji)は積極的使用:
    - (^^) (^_^) (>_<) (´・ω・`) (╹◡╹) (￣▽￣) (*´∀｀*) (TдT)
    - w ｗ の使用OK
    - 1記事2〜4個
  ■ **太字**を1段落に1〜2箇所 (※見出し代用には使わない)
  ■ 口調: 「です・ます」+ カジュアル崩し
    - 「〜ですよね」「〜じゃないですか」「マジで」「ぶっちゃけ」「正直」

