# Claude.ai用プロンプトテンプレート

zenn_article_prompt: |
  以下の英語記事を元に、日本のWebエンジニア向けの高品質な技術記事を作成してください。

  【元記事情報】
  タイトル: {title}
  著者: {authors}
  出典: {source}
  URL: {url}
  公開日: {published_date}

  【本文抜粋】
  {content}

  【絶対ルール】
  1. 引用は必ず以下の形式で:
     > "引用文"
     >
     > 出典: 著者/組織名. "タイトル"
     > URL
     > (取得日: YYYY年MM月DD日)

  2. データ・統計は必ず出典明記
  3. 主観的評価は「筆者の意見」と明記
  4. 参考文献セクションを最後に追加

  【作成条件】
  1. 構成
     - タイトル（35文字以内、キャッチー）
     - 導入（200字、なぜ重要か）
     - 元記事概要（引用明記）
     - 技術詳細（実装例・コード含む）
     - アーキテクチャ図指示（Mermaid記法）
     - 実践への示唆
     - まとめ（150字）
     - 参考文献

  2. リッチテキスト要件
     - 見出し: ##（H2）、###（H3）を適切に使用
     - 強調: **太字**で重要箇所を強調
     - コードブロック: ```言語名
     - 引用: > で引用ブロック
     - リスト・テーブル活用

  3. ビジュアル要件（Mermaid記法で指示）
     - アーキテクチャ図
     - フローチャート
     - シーケンス図

  4. コード要件
     - TypeScript/Python優先
     - エラーハンドリング必須
     - コメント付き
     - 実行可能な完全版

  5. 品質要件
     - 単なる翻訳ではなく、価値ある解説
     - 日本のエンジニアへの実践的示唆
     - 専門用語は初出時に説明
     - 具体例を豊富に

  【必須出力チェックリスト — これを満たさないと不合格】
  □ H2見出し(##)を最低4個使うこと（導入、概要、詳細、まとめ等）
  □ H1(#)はタイトルのみ。本文中にH1を使わないこと
  □ 引用ブロック(>)を最低3箇所使い、各引用に出典URL+取得日を付けること
  □ Mermaid図(```mermaid)を最低1個含めること
  □ コードブロック(```言語名)を最低1個含めること
  □ 参考文献セクション(## 参考文献)を末尾に配置し、URLリストを載せること

  文字数: 2500-3500字（コード除く）
  形式: Markdown

note_article_prompt: |
  以下のトレンド記事を元に、一般読者向けの分かりやすい記事を作成してください。

  【元記事情報】
  タイトル: {title}
  ソース: {source}
  URL: {url}
  トレンドスコア: {trend_score}

  【本文抜粋】
  {content}

  【絶対ルール】
  1. 引用は必ず出典明記（URL+取得日）
  2. 「月○万円稼いだ」等の表現は禁止
  3. 検証系は証拠（スクショ等）前提で記述
  4. 主観は明記

  【作成条件】
  1. 構成
     - タイトル（35文字、キャッチー）
     - 導入（なぜ話題か、200字）
     - 本文（具体例・図解多め）
     - 実践方法（該当時）
     - まとめ
     - 参考リンク

  2. トーン
     - 初心者にも分かりやすく
     - 専門用語は平易に説明
     - 「です・ます」調

  3. ビジュアル
     - 図表・Mermaid多用
     - Before/After比較（該当時）

  【必須出力チェックリスト — これを満たさないと不合格】
  □ H2見出し(##)を最低4個使うこと
  □ H1(#)はタイトルのみ。本文中にH1を使わないこと
  □ 引用ブロック(>)を最低3箇所使い、各引用に出典を付けること
  □ 図表(Mermaid ```mermaid またはテーブル)を最低1個含めること
  □ 参考文献セクション(## 参考文献)を末尾に配置し、URLリストを載せること

  文字数: 2500-3500字
  形式: Markdown

quality_evaluation_prompt: |
  以下の技術記事を評価してください。

  【記事内容】
  {article}

  【評価基準】
  1. オリジナリティ（10点満点）
     - 単なる翻訳・要約ではない
     - 独自の視点・解説がある
     - 実践的な示唆がある

  2. 技術的正確性（10点満点）
     - 技術説明が正確
     - コード例が動作する
     - 誤解を招く表現がない

  3. 視認性・構成（10点満点）
     - 見出し階層が適切
     - コードブロックが適切
     - 図表指示がある
     - リストが効果的

  4. 引用の適切性（10点満点）
     - 引用元が明記されている
     - 引用ブロックが適切
     - 参考文献リストがある

  5. 実用性（10点満点）
     - 読者が実践できる内容
     - 具体的なコード例
     - 実装のヒント

  【評価出力（JSON形式）】
  {
    "scores": {
      "originality": 0-10,
      "accuracy": 0-10,
      "readability": 0-10,
      "citation": 0-10,
      "practicality": 0-10
    },
    "total": 0-50,
    "pass": true/false,
    "feedback": "具体的な改善点",
    "should_regenerate": true/false
  }

# 構成パターンローテーション（提案D: テンプレ過学習防止）
article_structures:
  - name: standard
    description: "標準構成: 導入→概要→詳細→まとめ"
    outline: |
      1. 導入（なぜ重要か）
      2. 元記事概要
      3. 技術詳細/本文
      4. 実践への示唆
      5. まとめ
      6. 参考文献

  - name: tutorial
    description: "チュートリアル形式: ステップバイステップ"
    outline: |
      1. ゴール（何ができるようになるか）
      2. 前提条件
      3. Step 1: ...
      4. Step 2: ...
      5. Step 3: ...
      6. トラブルシューティング
      7. 次のステップ

  - name: comparison
    description: "比較レビュー形式: 選択肢の評価"
    outline: |
      1. 比較の背景と目的
      2. 候補一覧
      3. 評価軸の説明
      4. 比較表
      5. ユースケース別おすすめ
      6. 結論

  - name: deep_dive
    description: "深掘り解説: 一つのトピックを徹底分析"
    outline: |
      1. なぜ今このトピックが重要か
      2. 基礎知識（前提の確認）
      3. 核心部分の詳細解説
      4. 実装例/具体例
      5. 知られていない落とし穴
      6. 筆者の見解
      7. 参考文献

  - name: qa
    description: "Q&A形式: 読者の疑問に答える"
    outline: |
      1. この記事で答える疑問
      2. Q1: ...
      3. Q2: ...
      4. Q3: ...
      5. まとめ: 全体像
      6. さらに深く知りたい人へ
